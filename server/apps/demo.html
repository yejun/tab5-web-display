<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab5 demo</title>
<link rel="stylesheet" href="common.css">
<style>
  :root { --hue: 168; --accent: hsl(var(--hue), 75%, 64%); --accent-soft: hsl(var(--hue), 45%, 24%);
          --g1: hsl(var(--hue), 60%, 35%); }   /* the Accent slider recolours the sky too */
  body { padding: 28px 32px; display: grid; gap: 20px;
         grid-template: "head head head" 56px "count switches paint" 1fr "slider slider paint" 230px / 300px 340px 1fr; }
  header { grid-area: head; display: flex; align-items: center; gap: 18px; }
  header h1 { font-size: 34px; font-weight: 650; letter-spacing: -.015em; }
  header .sub { color: var(--dim); font-size: 19px; }
  #motion, #home { color: var(--ink); text-decoration: none; font-size: 19px; font-weight: 500; height: 48px; padding: 0 22px;
                   display: inline-flex; align-items: center; border-radius: 999px; border: 1px solid var(--edge); }
  #motion { margin-left: auto; background: var(--accent); color: #062019; border-color: transparent; font-weight: 600; }
  #home { margin-left: 12px; background: var(--glass2); }
  #home:hover { background: rgba(255, 255, 255, .10); }
  #motion:active, #home:active { filter: brightness(1.2); }
  #clock { margin-left: 22px; font-size: 38px; font-weight: 250; font-variant-numeric: tabular-nums; color: var(--accent);
           letter-spacing: -.02em; }
  .card { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .card h2 { font-size: 15px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .14em; }

  #count-card { grid-area: count; align-items: center; }
  #count { font-size: 124px; font-weight: 200; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums;
           margin: 14px 0 8px; }
  .row { display: flex; gap: 16px; }
  .row button { min-width: 96px; height: 84px; font-size: 44px; font-weight: 300; border-radius: 28px;
                background: var(--accent-soft); }
  .row button:active { background: var(--accent); color: var(--bg); transform: scale(.95); }
  button.small { height: 48px; font-size: 19px; padding: 0 22px; }

  #switches { grid-area: switches; justify-content: space-between; }
  .sw { display: flex; align-items: center; justify-content: space-between; height: 72px;
        border-bottom: 1px solid var(--line); }
  .sw:last-child { border: 0; }
  .sw span { font-size: 25px; font-weight: 500; }
  .toggle { width: 92px; height: 52px; border-radius: 26px; background: rgba(255, 255, 255, .10); position: relative;
            transition: background .15s; }
  .toggle::after { content: ""; position: absolute; left: 5px; top: 5px; width: 42px; height: 42px; border-radius: 50%;
                   background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); transition: left .15s; }
  .on .toggle { background: var(--accent); }
  .on .toggle::after { left: 45px; }

  #slider-card { grid-area: slider; }
  .slide { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 20px; height: 70px; }
  .slide span { font-weight: 500; }
  .slide b { font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; font-size: 28px; }
  input[type=range] { -webkit-appearance: none; height: 70px; background: transparent; width: 100%; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent) var(--p, 50%), rgba(255, 255, 255, .10) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 44px; height: 44px; margin-top: -16px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px var(--accent), 0 4px 12px rgba(0, 0, 0, .4); }
  #hue::-webkit-slider-runnable-track {
    background: linear-gradient(90deg, hsl(0,75%,64%), hsl(60,75%,64%), hsl(120,75%,64%), hsl(180,75%,64%),
                                       hsl(240,75%,64%), hsl(300,75%,64%), hsl(360,75%,64%)); }

  #paint-card { grid-area: paint; }
  #paint-card .row { justify-content: space-between; align-items: center; }
  canvas { flex: 1; border-radius: 18px; background: rgba(4, 6, 12, .55); border: 1px solid var(--line); touch-action: none; }
  #taps { color: var(--dim); font-size: 17px; }
</style>
</head>
<body>
  <header>
    <h1>Tab5 web display</h1><span class="sub">rendered by Chromium on the PC</span>
    <a id="motion" href="motion.html">Motion test →</a><a id="home" href="home.html">Home</a>
    <div id="clock">--:--:--</div>
  </header>

  <section class="card" id="count-card">
    <h2>Counter</h2>
    <div id="count">0</div>
    <div class="row"><button id="dec">−</button><button id="inc">+</button></div>
  </section>

  <section class="card" id="switches">
    <h2>Switches</h2>
    <div class="sw on"><span>Desk lamp</span><div class="toggle"></div></div>
    <div class="sw"><span>Fan</span><div class="toggle"></div></div>
    <div class="sw" id="music"><span>Music</span><div class="toggle"></div></div>
  </section>

  <section class="card" id="slider-card">
    <h2>Sliders</h2>
    <div class="slide"><span>Volume</span><input id="vol" type="range" min="0" max="100" value="80"><b id="vol-v">80</b></div>
    <div class="slide"><span>Accent</span><input id="hue" type="range" min="0" max="360" value="168"><b id="hue-v">168°</b></div>
  </section>

  <section class="card" id="paint-card">
    <div class="row"><h2>Finger paint</h2><span id="taps">drag to draw (and play)</span><button class="small" id="clear">Clear</button></div>
    <canvas id="paint"></canvas>
  </section>

<script>
  const $ = id => document.getElementById(id);

  // clock: one small update a second
  const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); };
  tick(); setInterval(tick, 1000);

  // counter
  let n = 0;
  $("inc").onclick = () => { $("count").textContent = ++n; blip(660 * 2 ** ((n % 12) / 12)); };
  $("dec").onclick = () => { $("count").textContent = --n; blip(330 * 2 ** ((n % 12) / 12)); };

  // sound (played on the Tab5 when the server has sound on): Web Audio, with the Volume slider as master volume
  const ac = new AudioContext(), master = ac.createGain();
  master.connect(ac.destination);
  addEventListener("pointerdown", () => ac.resume());
  function blip(freq, len = 0.08, type = "triangle", gain = 0.8, at = ac.currentTime) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, at); g.gain.exponentialRampToValueAtTime(0.001, at + len);
    o.connect(g).connect(master); o.start(at); o.stop(at + len);
  }

  // switches; "Music" plays a slow arpeggio while on
  const ARP = [262, 330, 392, 494, 523, 494, 392, 330];
  let music = null, step = 0;
  document.querySelectorAll(".sw").forEach(s => s.onclick = () => {
    const on = s.classList.toggle("on");
    blip(on ? 880 : 440, 0.06, "square", 0.3);
    if (s.id === "music") {
      clearInterval(music); music = null;
      if (on) music = setInterval(() => blip(ARP[step++ % ARP.length] * (step % 16 < 8 ? 1 : 0.75), 0.6, "triangle", 0.6), 250);
    }
  });

  // sliders
  const vol = $("vol"), hue = $("hue");
  const showVol = () => { vol.style.setProperty("--p", vol.value + "%"); $("vol-v").textContent = vol.value;
                          master.gain.value = vol.value / 100; };
  const showHue = () => { document.documentElement.style.setProperty("--hue", hue.value); $("hue-v").textContent = hue.value + "°"; };
  vol.oninput = showVol; hue.oninput = showHue; showVol(); showHue();

  // finger paint
  const cv = $("paint"), cx = cv.getContext("2d");
  const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; };
  fit();
  let last = null, strokes = 0;
  // drawing plays a tone: higher towards the top, louder towards the right
  const tone = ac.createOscillator(), toneGain = ac.createGain();
  tone.type = "sine"; toneGain.gain.value = 0;
  tone.connect(toneGain).connect(master); tone.start();
  const sing = ([x, y]) => {
    tone.frequency.setTargetAtTime(110 * 2 ** (3 * (1 - y / cv.height)), ac.currentTime, 0.01);
    toneGain.gain.setTargetAtTime(0.2 + 0.6 * x / cv.width, ac.currentTime, 0.02);
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => {
    last = pos(e); strokes++;
    $("taps").textContent = `stroke ${strokes} at ${Math.round(last[0])}, ${Math.round(last[1])}`;
    cx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    cx.beginPath(); cx.arc(last[0], last[1], 5, 0, 7); cx.fill();
    sing(last);
  });
  cv.addEventListener("pointermove", e => {
    if (!last) return;
    const p = pos(e);
    cx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    cx.lineWidth = 10; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(...last); cx.lineTo(...p); cx.stroke();
    last = p;
    sing(p);
  });
  addEventListener("pointerup", () => { last = null; toneGain.gain.setTargetAtTime(0, ac.currentTime, 0.05); });
  $("clear").onclick = () => { cx.clearRect(0, 0, cv.width, cv.height); strokes = 0; $("taps").textContent = "drag to draw (and play)"; };
</script>
</body>
</html>
