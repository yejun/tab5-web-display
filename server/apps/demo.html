<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab5 demo</title>
<style>
  :root {
    --bg: #11141c; --card: #1a1f2b; --line: #2a3142; --ink: #e8e4da; --dim: #8b93a7;
    --accent: hsl(var(--hue), 70%, 62%); --accent-soft: hsl(var(--hue), 45%, 24%); --hue: 168;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); color: var(--ink);
               font: 22px/1.3 "Inter", "Noto Sans", "DejaVu Sans", sans-serif; }
  body { padding: 28px 32px; display: grid; gap: 20px;
         grid-template: "head head head" 56px "count switches paint" 1fr "slider slider paint" 230px / 300px 340px 1fr; }
  header { grid-area: head; display: flex; align-items: baseline; gap: 18px; }
  header h1 { font-size: 34px; font-weight: 600; letter-spacing: .5px; }
  header .sub { color: var(--dim); font-size: 20px; }
  #motion { margin-left: auto; color: var(--ink); text-decoration: none; font-size: 22px; padding: 12px 22px;
            border: 1px solid var(--line); border-radius: 16px; background: var(--accent-soft); }
  #motion:active { background: var(--accent); color: var(--bg); }
  #clock { margin-left: 24px; font-size: 40px; font-variant-numeric: tabular-nums; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px 24px;
          display: flex; flex-direction: column; gap: 14px; }
  .card h2 { font-size: 18px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 2px; }

  #count-card { grid-area: count; align-items: center; }
  #count { font-size: 120px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; margin: 14px 0 8px; }
  .row { display: flex; gap: 16px; }
  button { font: inherit; color: var(--ink); background: var(--accent-soft); border: 1px solid var(--line);
           border-radius: 18px; min-width: 96px; height: 84px; font-size: 44px; }
  button:active { background: var(--accent); color: var(--bg); transform: scale(.95); }
  button.small { height: 56px; font-size: 22px; padding: 0 22px; }

  #switches { grid-area: switches; justify-content: space-between; }
  .sw { display: flex; align-items: center; justify-content: space-between; height: 72px;
        border-bottom: 1px solid var(--line); }
  .sw:last-child { border: 0; }
  .sw span { font-size: 26px; }
  .toggle { width: 96px; height: 52px; border-radius: 26px; background: #2b3242; position: relative; }
  .toggle::after { content: ""; position: absolute; left: 6px; top: 6px; width: 40px; height: 40px;
                   border-radius: 50%; background: var(--dim); }
  .on .toggle { background: var(--accent); }
  .on .toggle::after { left: 50px; background: var(--bg); }

  #slider-card { grid-area: slider; }
  .slide { display: grid; grid-template-columns: 150px 1fr 90px; align-items: center; gap: 20px; height: 70px; }
  .slide b { font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; font-size: 28px; }
  input[type=range] { -webkit-appearance: none; height: 70px; background: transparent; width: 100%; }
  input[type=range]::-webkit-slider-runnable-track { height: 14px; border-radius: 7px;
    background: linear-gradient(90deg, var(--accent) var(--p, 50%), #2b3242 var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 48px; height: 48px; margin-top: -17px;
    border-radius: 50%; background: var(--ink); border: 6px solid var(--accent); }
  #hue::-webkit-slider-runnable-track {
    background: linear-gradient(90deg, hsl(0,70%,62%), hsl(60,70%,62%), hsl(120,70%,62%), hsl(180,70%,62%),
                                       hsl(240,70%,62%), hsl(300,70%,62%), hsl(360,70%,62%)); }

  #paint-card { grid-area: paint; }
  #paint-card .row { justify-content: space-between; align-items: center; }
  canvas { flex: 1; border-radius: 14px; background: #0c0f15; touch-action: none; }
  #taps { color: var(--dim); font-size: 18px; }
</style>
</head>
<body>
  <header>
    <h1>Tab5 web display</h1><span class="sub">rendered by Chromium on the PC</span>
    <a id="motion" href="home.html">⌂ Home</a>
    <div id="clock">--:--:--</div>
  </header>

  <section class="card" id="count-card">
    <h2>Counter</h2>
    <div id="count">0</div>
    <div class="row"><button id="dec">−</button><button id="inc">+</button></div>
  </section>

  <section class="card" id="switches">
    <h2>Switches</h2>
    <div class="sw on"><span>Desk lamp</span><div class="toggle"></div></div>
    <div class="sw"><span>Fan</span><div class="toggle"></div></div>
    <div class="sw"><span>Do not disturb</span><div class="toggle"></div></div>
  </section>

  <section class="card" id="slider-card">
    <h2>Sliders</h2>
    <div class="slide"><span>Volume</span><input id="vol" type="range" min="0" max="100" value="40"><b id="vol-v">40</b></div>
    <div class="slide"><span>Accent</span><input id="hue" type="range" min="0" max="360" value="168"><b id="hue-v">168°</b></div>
  </section>

  <section class="card" id="paint-card">
    <div class="row"><h2>Finger paint</h2><span id="taps">drag to draw</span><button class="small" id="clear">Clear</button></div>
    <canvas id="paint"></canvas>
  </section>

<script>
  const $ = id => document.getElementById(id);

  // clock: one small update a second
  const tick = () => { $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false }); };
  tick(); setInterval(tick, 1000);

  // counter
  let n = 0;
  $("inc").onclick = () => $("count").textContent = ++n;
  $("dec").onclick = () => $("count").textContent = --n;

  // switches
  document.querySelectorAll(".sw").forEach(s => s.onclick = () => s.classList.toggle("on"));

  // sliders
  const vol = $("vol"), hue = $("hue");
  const showVol = () => { vol.style.setProperty("--p", vol.value + "%"); $("vol-v").textContent = vol.value; };
  const showHue = () => { document.documentElement.style.setProperty("--hue", hue.value); $("hue-v").textContent = hue.value + "°"; };
  vol.oninput = showVol; hue.oninput = showHue; showVol(); showHue();

  // finger paint
  const cv = $("paint"), cx = cv.getContext("2d");
  const fit = () => { const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; };
  fit();
  let last = null, strokes = 0;
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => {
    last = pos(e); strokes++;
    $("taps").textContent = `stroke ${strokes} at ${Math.round(last[0])}, ${Math.round(last[1])}`;
    cx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    cx.beginPath(); cx.arc(last[0], last[1], 5, 0, 7); cx.fill();
  });
  cv.addEventListener("pointermove", e => {
    if (!last) return;
    const p = pos(e);
    cx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--accent");
    cx.lineWidth = 10; cx.lineCap = "round";
    cx.beginPath(); cx.moveTo(...last); cx.lineTo(...p); cx.stroke();
    last = p;
  });
  addEventListener("pointerup", () => last = null);
  $("clear").onclick = () => { cx.clearRect(0, 0, cv.width, cv.height); strokes = 0; $("taps").textContent = "drag to draw"; };
</script>
</body>
</html>
