<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab5 clock</title>
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 28px 32px; display: grid; grid-template-columns: 1fr 470px; gap: 20px; }
  #left { display: flex; flex-direction: column; padding: 34px 40px; }
  #timebox { display: flex; align-items: flex-end; gap: 18px; }
  #time { font-size: 216px; font-weight: 150; line-height: .86; letter-spacing: -.055em; }
  #side { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }
  #sec { font-size: 54px; font-weight: 250; color: var(--accent); line-height: 1; letter-spacing: -.02em; }
  #period { font-size: 40px; font-weight: 400; color: var(--dim); line-height: 1; }
  #date { font-size: 36px; font-weight: 500; letter-spacing: -.01em; margin-top: 28px; }
  #meta { font-size: 21px; color: var(--dim); margin-top: 8px; }
  #hint { font-size: 16px; color: var(--faint); margin-top: 6px; }
  #zones { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: auto; }
  .zone { background: var(--glass2); border: 1px solid rgba(255, 255, 255, .07); border-radius: 20px; padding: 16px 20px; }
  .zone b { display: block; font-size: 15px; font-weight: 600; color: var(--faint); text-transform: uppercase;
            letter-spacing: .12em; }
  .zone span { font-size: 36px; font-weight: 250; letter-spacing: -.02em; }
  .zone span small { font-size: 17px; font-weight: 500; color: var(--dim); margin-left: 6px; letter-spacing: 0; }
  .zone i { display: block; font-style: normal; font-size: 16px; color: var(--dim); }

  #cal { display: flex; flex-direction: column; }
  #cal .top { display: flex; align-items: center; justify-content: space-between; }
  #month { font-size: 28px; font-weight: 600; letter-spacing: -.01em; margin: 24px 0 12px; display: flex; align-items: center; }
  #month span { flex: 1; }
  #month button { width: 52px; height: 52px; font-size: 26px; margin-left: 10px; display: grid; place-items: center; }
  #month button svg { width: 22px; height: 22px; }
  #grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  #grid .h { font-size: 14px; color: var(--faint); font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
             padding-bottom: 6px; }
  #grid .d { height: 56px; line-height: 56px; border-radius: 18px; font-size: 22px; font-weight: 450; }
  #grid .o { color: rgba(226, 232, 244, .22); }
  #grid .w { color: var(--dim); }
  #grid .t { background: linear-gradient(145deg, #6ff0d4, #24a8a8); color: #052a24; font-weight: 700;
             box-shadow: 0 8px 22px -6px rgba(60, 220, 190, .6); }
  #today { margin-top: auto; height: 54px; font-size: 19px; }
</style>
</head>
<body>
  <section class="card" id="left">
    <div id="timebox"><div id="time" class="num">--:--</div><div id="side"><div id="sec" class="num"></div><div id="period"></div></div></div>
    <div id="date"></div>
    <div id="meta"></div>
    <div id="hint">Tap the time to show or hide seconds</div>
    <div id="zones"></div>
  </section>
  <section class="card" id="cal">
    <div class="top"><span class="label">Calendar</span><a class="home"></a></div>
    <div id="month"><span></span><button id="prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div id="grid"></div>
    <button id="today">Back to this month</button>
  </section>

<script src="common.js"></script>
<script>
  // world clocks: --set zones=Europe/London,Asia/Tokyo,...
  const zones = (TAB5.zones || "Europe/London,Asia/Tokyo,America/New_York").split(",").slice(0, 3);
  let showSec = false;
  try { showSec = localStorage.getItem("clock.seconds") === "1"; } catch {}

  function weekNumber(d) {   // ISO 8601
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
    return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7);
  }

  function tickMinute() {
    const d = new Date();
    const t = timeParts(d);
    $("time").textContent = t.hm;
    $("period").textContent = t.period;
    $("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    const doy = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
    $("meta").textContent = `Week ${weekNumber(d)} · Day ${doy}`;
    $("zones").innerHTML = zones.map(z => {
      const t = timeParts(d, { timeZone: z });
      // which day it is there, and how far ahead or behind: "Tomorrow · +13h"
      const ymd = tz => d.toLocaleDateString("en-CA", { timeZone: tz });
      const there = ymd(z), here = ymd(undefined);
      const day = there === here ? "Today" : there > here ? "Tomorrow" : "Yesterday";
      const wall = tz => new Date(d.toLocaleString("en-US", { timeZone: tz }));
      const mins = Math.round((wall(z) - wall(undefined)) / 900000) * 15;
      const off = mins === 0 ? "" : ` · ${mins > 0 ? "+" : "−"}${Math.floor(Math.abs(mins) / 60)}h${Math.abs(mins) % 60 || ""}`;
      return `<div class="zone"><b>${z.split("/").pop().replace(/_/g, " ")}</b>
              <span class="num">${t.hm}<small>${t.period}</small></span><i>${day}${off}</i></div>`;
    }).join("");
    if (d.getDate() !== shownToday) { shownToday = d.getDate(); drawCal(); }
    skyForHour(d.getHours());
  }
  let secTimer = null, shownToday = -1;
  function applySeconds() {
    clearInterval(secTimer);
    $("sec").textContent = "";
    if (showSec) {
      const s = () => $("sec").textContent = String(new Date().getSeconds()).padStart(2, "0");
      s(); secTimer = setInterval(s, 1000);
    }
  }
  $("timebox").onclick = () => {
    showSec = !showSec;
    try { localStorage.setItem("clock.seconds", showSec ? "1" : "0"); } catch {}
    applySeconds();
  };

  // calendar
  let view = new Date(); view.setDate(1);
  function drawCal() {
    const now = new Date(), y = view.getFullYear(), m = view.getMonth();
    $("month").firstElementChild.textContent = view.toLocaleDateString([], { month: "long", year: "numeric" });
    const fd = firstDayOfWeek(), first = (new Date(y, m, 1).getDay() - fd + 7) % 7;
    const days = new Date(y, m + 1, 0).getDate(), prevDays = new Date(y, m, 0).getDate();
    let html = "";
    for (let i = 0; i < 7; i++)   // 2023-01-01 was a Sunday
      html += `<div class="h">${new Date(2023, 0, 1 + (fd + i) % 7).toLocaleDateString([], { weekday: "short" }).slice(0, 2)}</div>`;
    for (let i = 0; i < 42; i++) {
      const n = i - first + 1;
      if (n < 1) html += `<div class="d o">${prevDays + n}</div>`;
      else if (n > days) html += `<div class="d o">${n - days}</div>`;
      else {
        const today = y === now.getFullYear() && m === now.getMonth() && n === now.getDate();
        const wd = new Date(y, m, n).getDay(), weekend = wd === 0 || wd === 6;
        html += `<div class="d${today ? " t" : weekend ? " w" : ""}">${n}</div>`;
      }
    }
    $("grid").innerHTML = html;
  }
  $("prev").onclick = () => { view.setMonth(view.getMonth() - 1); drawCal(); };
  $("next").onclick = () => { view.setMonth(view.getMonth() + 1); drawCal(); };
  $("today").onclick = () => { view = new Date(); view.setDate(1); drawCal(); };

  everyMinute(tickMinute);
  applySeconds();
</script>
</body>
</html>
