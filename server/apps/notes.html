<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab5 notes</title>
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 28px 32px; display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; align-items: center; gap: 18px; height: 52px; }
  header h1 { font-size: 34px; font-weight: 650; letter-spacing: -.015em; }
  header .dim { font-size: 19px; padding: 4px 12px; border-radius: 999px; background: var(--glass2); }
  header .sp { flex: 1; }
  #add { height: 48px; padding: 0 22px; font-size: 19px; }
  #board { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 18px; }
  /* paper: the colour, a light sheen at the top, a soft shadow */
  .note { border-radius: 20px; padding: 18px 20px; color: #1a1d24; display: flex; flex-direction: column; overflow: hidden;
          background-image: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 45%);
          box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 14px 28px -12px rgba(0, 0, 0, .6); }
  .note:hover { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 0 3px rgba(255, 255, 255, .35), 0 14px 28px -12px rgba(0, 0, 0, .6); }
  .note:active { transform: scale(.97); }
  .note p { font-size: 22px; font-weight: 500; line-height: 1.32; white-space: pre-wrap; overflow: hidden; flex: 1; word-break: break-word; }
  .note small { font-size: 14px; font-weight: 600; opacity: .55; margin-top: 6px; letter-spacing: .06em; text-transform: uppercase; }
  .empty { grid-column: 1 / -1; grid-row: 1 / -1; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 18px; color: var(--dim); font-size: 24px; }
  .empty svg { width: 84px; height: 84px; opacity: .8; }

  /* editor */
  #ed { position: fixed; inset: 0; background: rgba(4, 6, 12, .55); backdrop-filter: blur(14px); display: none; }
  #ed.open { display: block; }
  #paper { position: absolute; left: 160px; top: 22px; width: 960px; height: 360px; border-radius: 24px; padding: 20px 24px;
           display: flex; flex-direction: column; gap: 12px; color: #1a1d24;
           background-image: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 45%);
           box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 24px 50px -16px rgba(0, 0, 0, .7); }
  #text { flex: 1; resize: none; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 28px;
          font-weight: 500; line-height: 1.35; color: inherit; user-select: text; }
  #tools { display: flex; align-items: center; gap: 12px; }
  .sw { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(0, 0, 0, .12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5); }
  .sw.on { border-color: #1a1d24; }
  #tools .sp { flex: 1; }
  #tools button { height: 50px; padding: 0 24px; font-size: 19px; }
  #del { background: transparent; color: #1a1d24; border-color: rgba(0, 0, 0, .25); }
  #done { background: #1a1d24; color: #fff; border-color: transparent; }

  /* on-screen keyboard (the page runs in Chromium on the PC, so it brings its own) */
  #kb { position: absolute; left: 0; right: 0; bottom: 0; height: 306px; padding: 10px;
        background: var(--grain), rgba(12, 15, 24, .82); border-top: 1px solid var(--edge);
        display: grid; grid-template-rows: repeat(4, 1fr); gap: 8px; }
  .row { display: flex; gap: 8px; }
  .k { flex: 1; display: grid; place-items: center; background: rgba(255, 255, 255, .09); border-radius: 14px;
       font-size: 28px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
  .k:active, .k.down { background: var(--accent); color: var(--bg); }
  .k.fn { background: rgba(255, 255, 255, .045); font-size: 22px; }
  .k.w15 { flex: 1.5; } .k.w2 { flex: 2; } .k.w5 { flex: 5.5; }
  .k.lit { background: var(--accent-soft); }
</style>
</head>
<body>
  <header><h1>Sticky notes</h1><span class="dim" id="count"></span><span class="sp"></span>
    <button id="add" class="primary">+ New note</button><a class="home"></a></header>
  <main id="board"></main>

  <div id="ed">
    <div id="paper">
      <textarea id="text" spellcheck="false"></textarea>
      <div id="tools"><span id="swatches" style="display:flex;gap:10px"></span><span class="sp"></span>
        <button id="del">Delete</button><button id="done">Done</button></div>
    </div>
    <div id="kb"></div>
  </div>

<script src="common.js"></script>
<script>
  const COLORS = ["#f2d77a", "#f4a9b8", "#9fcdf5", "#8fe3cf", "#c8b6f5", "#f5bf8e"];
  const MAX = 12;
  let notes = [];
  try { notes = JSON.parse(localStorage.getItem("notes") || "null"); } catch {}
  if (!Array.isArray(notes)) notes = [];
  const save = () => { try { localStorage.setItem("notes", JSON.stringify(notes)); } catch {} };
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

  function draw() {
    $("count").textContent = `${notes.length} of ${MAX}`;
    $("add").style.visibility = notes.length < MAX ? "visible" : "hidden";
    $("board").innerHTML = notes.length ? notes.map((n, i) =>
      `<div class="note" data-i="${i}" style="background:${COLORS[n.color]}"><p>${esc(n.text) || "<i style='opacity:.5'>Empty note</i>"}</p>
       <small>${new Date(n.t).toLocaleDateString([], { month: "short", day: "numeric" })}</small></div>`).join("")
      : `<div class="empty"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round"><path d="M9 7h22v16l-9 10H9z"/><path d="M22 33V23h9M14 14h12M14 20h6"/></svg>
           No notes yet. Tap “+ New note” to write one.</div>`;
    document.querySelectorAll(".note").forEach(el => el.onclick = () => edit(+el.dataset.i));
  }

  // ---- editor ----
  let cur = -1;
  function edit(i) {
    cur = i;
    $("text").value = notes[i].text;
    paint();
    $("ed").classList.add("open");
    const ta = $("text");
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
  }
  function paint() {
    $("paper").style.background = COLORS[notes[cur].color];
    $("swatches").innerHTML = COLORS.map((c, i) => `<div class="sw${i === notes[cur].color ? " on" : ""}" data-c="${i}" style="background:${c}"></div>`).join("");
    document.querySelectorAll(".sw").forEach(s => s.onclick = () => { notes[cur].color = +s.dataset.c; paint(); });
  }
  function close() {
    notes[cur].text = $("text").value;
    if (!notes[cur].text.trim()) notes.splice(cur, 1);   // an emptied note isn't kept
    else notes[cur].t = Date.now();
    save(); draw();
    $("ed").classList.remove("open");
  }
  $("done").onclick = close;
  $("del").onclick = () => { notes.splice(cur, 1); save(); draw(); $("ed").classList.remove("open"); };
  $("add").onclick = () => {
    if (notes.length >= MAX) return;
    notes.unshift({ text: "", color: notes.length % COLORS.length, t: Date.now() });
    draw(); edit(0);
  };

  // ---- keyboard ----
  const LAYOUTS = {
    abc: ["q w e r t y u i o p ⌫", "a s d f g h j k l ↵", "⇧ z x c v b n m , . ?", "123 space ✓"],
    "123": ["1 2 3 4 5 6 7 8 9 0 ⌫", "@ # & * ( ) - + = / ↵", "abc ! ' \" : ; % _ ~ €", "abc space ✓"],
  };
  let layout = "abc", shift = false;
  function drawKb() {
    $("kb").innerHTML = LAYOUTS[layout].map(r => `<div class="row">${r.split(" ").map(k => {
      const fn = ["⌫", "↵", "⇧", "123", "abc", "✓"].includes(k);
      const w = k === "space" ? " w5" : k === "⇧" || k === "⌫" ? " w15" : k === "123" || k === "abc" || k === "✓" ? " w2" : "";
      const label = k === "space" ? "" : shift && k.length === 1 ? k.toUpperCase() : k;
      return `<div class="k${fn ? " fn" : ""}${w}${k === "⇧" && shift ? " lit" : ""}" data-k="${k}">${label}</div>`;
    }).join("")}</div>`).join("");
  }
  function type(s) {
    const ta = $("text");
    ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end");
  }
  // pointerdown so fast typing doesn't wait for a click; preventDefault keeps the textarea's caret and focus
  $("kb").addEventListener("pointerdown", e => {
    const el = e.target.closest(".k");
    if (!el) return;
    e.preventDefault();
    const k = el.dataset.k, ta = $("text");
    if (k === "⌫") {
      if (ta.selectionStart !== ta.selectionEnd) type("");
      else if (ta.selectionStart > 0) ta.setRangeText("", ta.selectionStart - 1, ta.selectionStart, "end");
    } else if (k === "↵") type("\n");
    else if (k === "space") type(" ");
    else if (k === "⇧") { shift = !shift; drawKb(); return; }
    else if (k === "123" || k === "abc") { layout = k; shift = false; drawKb(); return; }
    else if (k === "✓") { close(); return; }
    else { type(shift ? k.toUpperCase() : k); if (shift) { shift = false; drawKb(); return; } }
    ta.focus();
  });
  drawKb();
  draw();
</script>
</body>
</html>
