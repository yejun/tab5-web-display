<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab5 dashboard</title>
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 28px 32px; display: grid; gap: 20px; grid-template: "now chart" 248px "now week" 140px "now news" 1fr / 400px 1fr; }
  #now { grid-area: now; display: flex; flex-direction: column; }
  #time { font-size: 100px; font-weight: 300; line-height: 1; letter-spacing: -2px; display: flex; align-items: baseline; }
  #time small { font-size: 30px; letter-spacing: 0; margin-left: 12px; color: var(--dim); }
  #date { font-size: 24px; color: var(--dim); margin-top: 8px; }
  #place { font-size: 20px; color: var(--faint); margin-top: 4px; }
  #cur { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  #cur-t { font-size: 76px; font-weight: 300; line-height: 1; }
  #cur-text { font-size: 24px; margin-top: 8px; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin-top: 22px; font-size: 20px; }
  .facts span:nth-child(odd) { color: var(--dim); }
  #aqi { display: inline-flex; align-items: center; gap: 10px; }
  #aqi i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
  #updated { margin-top: auto; font-size: 16px; color: var(--faint); }

  #chart { grid-area: chart; position: relative; }
  #chart .top { display: flex; align-items: center; justify-content: space-between; }
  #hours { position: absolute; left: 24px; top: 66px; }
  #week { grid-area: week; display: grid; grid-template-columns: repeat(6, 1fr); padding: 10px 10px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 20px; }
  .day b { font-weight: 500; color: var(--dim); font-size: 18px; }
  .day .hi { font-weight: 500; }
  .day .lo { color: var(--dim); }
  #news { grid-area: news; overflow: hidden; }
  #news ol { list-style: none; padding: 0; margin-top: 10px; }
  #news li { display: flex; gap: 14px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line);
             font-size: 20px; white-space: nowrap; }
  #news li:last-child { border: 0; }
  #news .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #news .m { color: var(--faint); font-size: 16px; }
  #news .n { color: var(--accent); font-size: 16px; width: 18px; }
</style>
</head>
<body>
  <section class="card" id="now">
    <div id="time" class="num">--:--</div>
    <div id="date"></div>
    <div id="place"></div>
    <div id="cur"><div id="cur-icon"></div><div><div id="cur-t" class="num">--°</div><div id="cur-text"></div></div></div>
    <div class="facts">
      <span>Feels like</span><span id="feels" class="num">–</span>
      <span>Humidity</span><span id="hum" class="num">–</span>
      <span>Wind</span><span id="wind" class="num">–</span>
      <span>Sun</span><span id="sun" class="num">–</span>
      <span>Air quality</span><span id="aqi">–</span>
    </div>
    <div id="updated"></div>
  </section>
  <section class="card" id="chart">
    <div class="top"><span class="label">Next 24 hours</span><a class="home"></a></div>
    <svg id="hours" width="760" height="170"></svg>
  </section>
  <section class="card" id="week"></section>
  <section class="card" id="news"><span class="label">Hacker News</span><ol id="hn"></ol></section>

<script src="common.js"></script>
<script>
  const deg = v => Math.round(v) + "°";

  everyMinute(() => {
    const d = new Date();
    const t = timeParts(d);
    $("time").innerHTML = `${t.hm}<small>${t.period}</small>`;
    $("date").textContent = d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  });

  async function weather() {
    const p = await place();
    $("place").textContent = p.name;
    const u = p.imperial ? "&temperature_unit=fahrenheit&wind_speed_unit=mph" : "";
    const w = await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${p.lat}&longitude=${p.lon}&timezone=auto` +
      "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day" +
      "&hourly=temperature_2m,precipitation_probability,weather_code,is_day" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=7" + u);
    const c = w.current, [text, kind] = weatherInfo(c.weather_code);
    $("cur-icon").innerHTML = weatherIcon(kind, c.is_day, 96);
    $("cur-t").textContent = deg(c.temperature_2m);
    $("cur-text").textContent = text;
    $("feels").textContent = deg(c.apparent_temperature);
    $("hum").textContent = c.relative_humidity_2m + "%";
    $("wind").textContent = Math.round(c.wind_speed_10m) + (p.imperial ? " mph" : " km/h");
    const hm = s => fmtTime(new Date(s));   // times are local to the place; fine while it's our own time zone
    $("sun").textContent = `↑ ${hm(w.daily.sunrise[0])}   ↓ ${hm(w.daily.sunset[0])}`;
    drawHours(w);
    $("week").innerHTML = w.daily.time.slice(1, 7).map((t, i) => {
      const k = i + 1, [, dk] = weatherInfo(w.daily.weather_code[k]);
      const name = new Date(t + "T12:00").toLocaleDateString([], { weekday: "short" });
      return `<div class="day"><b>${name}</b>${weatherIcon(dk, true, 52)}
              <span><span class="hi">${deg(w.daily.temperature_2m_max[k])}</span>
              <span class="lo">${deg(w.daily.temperature_2m_min[k])}</span></span></div>`;
    }).join("");
    $("updated").textContent = "Weather updated " + fmtTime(new Date()) + " · Open-Meteo";
  }

  // 24 hours from now: temperature line, rain-chance bars, a label every 3 hours
  function drawHours(w) {
    const h = w.hourly, start = Math.max(0, h.time.findIndex(t => t.slice(0, 13) >= w.current.time.slice(0, 13)));
    const n = 24, T = h.temperature_2m.slice(start, start + n), P = h.precipitation_probability.slice(start, start + n);
    const W = 760, H = 170, top = 34, bot = 128, lo = Math.min(...T), hi = Math.max(...T), span = Math.max(hi - lo, 4);
    const x = i => 14 + i * (W - 28) / (n - 1), y = v => bot - (v - lo) / span * (bot - top);
    let s = `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/>
             <stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
    P.forEach((p, i) => { if (p > 0) s += `<rect x="${x(i) - 9}" y="${bot + 12 - p * .4}" width="18" height="${p * .4}" rx="3"
                                                 fill="var(--sky)" opacity=".55"/>`; });
    const line = T.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join("");
    s += `<path d="${line}L${x(n - 1)} ${bot}L${x(0)} ${bot}Z" fill="url(#g)"/>`;
    s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    for (let i = 0; i < n; i += 3) {
      const hr = new Date(h.time[start + i]);
      s += `<text x="${x(i)}" y="${y(T[i]) - 12}" fill="var(--ink)" font-size="19" text-anchor="middle">${deg(T[i])}</text>`;
      s += `<text x="${i ? x(i) : 2}" y="${H - 4}" fill="var(--dim)" font-size="17" text-anchor="${i ? "middle" : "start"}">${
            i ? hr.toLocaleTimeString([], { hour: "numeric" }) : "Now"}</text>`;
    }
    $("hours").innerHTML = s;
  }

  async function air() {
    const p = await place();
    const a = await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${p.lat}&longitude=${p.lon}&current=us_aqi`);
    const v = Math.round(a.current.us_aqi);
    const [word, col] = v <= 50 ? ["Good", "#5ad08a"] : v <= 100 ? ["Moderate", "#f2cf6b"] : v <= 150 ? ["Unhealthy for some", "#f0a868"]
                      : v <= 200 ? ["Unhealthy", "#ef6f6f"] : ["Very unhealthy", "#b49cf0"];
    $("aqi").innerHTML = `<i style="background:${col}"></i>${v} · ${word}`;
  }

  async function news() {
    const ids = (await getJSON("https://hacker-news.firebaseio.com/v0/topstories.json")).slice(0, 4);
    const items = await Promise.all(ids.map(id => getJSON(`https://hacker-news.firebaseio.com/v0/item/${id}.json`)));
    $("hn").innerHTML = items.map((it, i) => {
      let host = "";
      try { host = new URL(it.url).hostname.replace(/^www\./, ""); } catch { host = "news.ycombinator.com"; }
      const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      return `<li><span class="n">${i + 1}</span><span class="t">${esc(it.title)}</span>
              <span class="m">${it.score} pts · ${esc(host)}</span></li>`;
    }).join("");
  }

  // refresh on a schedule; on failure show it and try again sooner
  function keep(fn, everyMin, onError) {
    const run = () => fn().then(() => setTimeout(run, everyMin * 60000))
                          .catch(e => { console.error(e); onError(e); setTimeout(run, 60000); });
    run();
  }
  keep(weather, 15, e => $("updated").textContent = "Weather unavailable (" + e.message + "), retrying");
  keep(air, 30, () => $("aqi").textContent = "–");
  keep(news, 10, () => $("hn").innerHTML = '<li class="dim">Headlines unavailable, retrying</li>');
</script>
</body>
</html>
